services:
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://prayer:prayer@db:5432/prayer}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports: ["8080:8080"]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: prayer
      POSTGRES_USER: prayer
      POSTGRES_PASSWORD: prayer
    volumes: ["pgdata:/var/lib/postgresql/data"]
  admin:
    build: ./apps/admin-web
    ports: ["3001:3000"]
volumes:
  pgdata:
